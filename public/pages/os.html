<!DOCTYPE html>
<html lang="pt-PT" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Industrial - Ordens de Serviço</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { dark: { 900: '#0f172a', 800: '#1e293b', 700: '#334155' }, brand: '#3b82f6' }, fontSize: { 'xxs': '0.65rem' } } }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-track { background: #0f172a; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; }
        /* Customização dos inputs do SweetAlert */
        .swal2-input, .swal2-select { 
            background-color: rgba(0, 0, 0, 0.04) !important; 
            width: 85% !important; 
            margin: 10px auto !important; 
            color: inherit !important;
        }

        /* Correção do contraste das opções do Select (Modo Claro) */
        .swal2-select option {
            background-color: #ffffff !important;
            color: #1e293b !important;
        }

        /* Correção do contraste das opções do Select (Modo Escuro) */
        .dark .swal2-select option {
            background-color: #1e293b !important;
            color: #f8fafc !important;
        }
        
        /* Nova rolagem interna para o Kanban */
        .kanban-col {
            max-height: calc(100vh - 270px);
            overflow-y: auto;
            padding-right: 4px;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-[#0b1120] dark:text-slate-300 font-sans h-screen flex overflow-hidden text-sm transition-colors duration-300">

    <!-- MENU LATERAL -->
    <aside id="sidebar" class="w-64 bg-white dark:bg-dark-900 border-r border-slate-200 dark:border-dark-800 flex flex-col transition-all duration-300 z-40 relative">
        
        <!-- Botão de Colapsar -->
        <button id="toggle-sidebar" class="absolute -right-3 top-8 bg-white dark:bg-dark-800 border border-slate-200 dark:border-dark-700 text-slate-500 rounded-full w-6 h-6 flex items-center justify-center hover:text-brand transition-colors z-50 shadow-sm">
            <i class="fas fa-chevron-left text-[10px] transition-transform duration-300" id="sidebar-icon"></i>
        </button>

        <div class="p-6 flex items-center justify-center border-b border-slate-200 dark:border-dark-800/50 h-20 overflow-hidden">
            <!-- Logo Grande -->
            <img src="../../IMG/canvas-b.png" alt="Nexus Logo" id="sidebar-logo" class="h-10 w-auto invert dark:invert-0 transition-all duration-300 drop-shadow-md" onerror="this.src='https://placehold.co/120x40/1e293b/ffffff?text=NEXUS'">
            <!-- Ícone Mini (Aparece quando fechado) -->
            <div id="sidebar-logo-mini" class="hidden w-10 h-10 bg-brand rounded-lg flex items-center justify-center text-white font-bold text-xl shadow-md shrink-0">N</div>
        </div>

        <nav class="flex-1 p-3 space-y-2 overflow-y-auto overflow-x-hidden" id="sidebar-nav">
            <p class="sidebar-text text-xs font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-4 mt-2 px-2 transition-opacity duration-300 whitespace-nowrap">Painel</p>
            
            <a href="menu.html" title="Visão Global" class="nav-link flex items-center gap-3 px-3 py-3 rounded-xl text-slate-500 hover:bg-slate-100 hover:text-brand dark:text-slate-400 dark:hover:bg-dark-800 dark:hover:text-white transition-all duration-300">
                <i class="fas fa-chart-pie w-6 text-center shrink-0"></i> 
                <span class="sidebar-text transition-opacity duration-300 whitespace-nowrap">Visão Global</span>
            </a>

            <a href="mapa.html" title="Planta Industrial" class="nav-link flex items-center gap-3 px-3 py-3 rounded-xl text-slate-500 hover:bg-slate-100 hover:text-brand dark:text-slate-400 dark:hover:bg-dark-800 dark:hover:text-white transition-all duration-300">
                <i class="fas fa-map-marked-alt w-6 text-center shrink-0"></i> 
                <span class="sidebar-text transition-opacity duration-300 whitespace-nowrap">Planta Industrial</span>
            </a>

            <a href="ativos.html" title="Parque de Ativos" class="nav-link flex items-center gap-3 px-3 py-3 rounded-xl text-slate-500 hover:bg-slate-100 hover:text-brand dark:text-slate-400 dark:hover:bg-dark-800 dark:hover:text-white transition-all duration-300">
                <i class="fas fa-microchip w-6 text-center shrink-0"></i> 
                <span class="sidebar-text transition-opacity duration-300 whitespace-nowrap">Parque de Ativos</span>
            </a>
            
            <a href="os.html" title="Ordens de Serviço" class="nav-link flex items-center gap-3 px-3 py-3 rounded-xl text-slate-500 hover:bg-slate-100 hover:text-brand dark:text-slate-400 dark:hover:bg-dark-800 dark:hover:text-white transition-all duration-300">
                <i class="fas fa-clipboard-list w-6 text-center shrink-0"></i> 
                <span class="sidebar-text transition-opacity duration-300 whitespace-nowrap">Ordens de Serviço</span>
            </a>
            
            <a href="estoque.html" title="Estoque (MRO)" class="nav-link flex items-center gap-3 px-3 py-3 rounded-xl text-slate-500 hover:bg-slate-100 hover:text-brand dark:text-slate-400 dark:hover:bg-dark-800 dark:hover:text-white transition-all duration-300">
                <i class="fas fa-boxes w-6 text-center shrink-0"></i> 
                <span class="sidebar-text transition-opacity duration-300 whitespace-nowrap">Estoque (MRO)</span>
            </a>
            
            <a href="financeiro.html" title="Financeiro" class="nav-link flex items-center gap-3 px-3 py-3 rounded-xl text-slate-500 hover:bg-slate-100 hover:text-brand dark:text-slate-400 dark:hover:bg-dark-800 dark:hover:text-white transition-all duration-300">
                <i class="fas fa-wallet w-6 text-center shrink-0"></i> 
                <span class="sidebar-text transition-opacity duration-300 whitespace-nowrap">Financeiro</span>
            </a>
        </nav>

        <div class="p-3 border-t border-slate-200 dark:border-dark-800/50">
            <button id="theme-toggle" title="Alternar Tema" class="w-full flex items-center gap-3 px-3 py-3 rounded-xl text-slate-500 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-dark-800 dark:hover:text-white transition-all duration-300 mb-2">
                <i class="fas fa-sun text-amber-500 hidden dark:block w-6 text-center shrink-0"></i>
                <i class="fas fa-moon text-slate-600 block dark:hidden w-6 text-center shrink-0"></i>
                <span class="sidebar-text font-medium transition-opacity duration-300 whitespace-nowrap">Alternar Tema</span>
            </button>
            
            <a href="../../index.html" title="Sair do Sistema" class="flex items-center gap-3 px-3 py-3 rounded-xl text-red-500 hover:bg-red-50 dark:hover:bg-red-500/10 transition-all duration-300">
                <i class="fas fa-sign-out-alt w-6 text-center shrink-0"></i>
                <span class="sidebar-text font-medium transition-opacity duration-300 whitespace-nowrap">Sair</span>
            </a>
        </div>
    </aside>


    <main class="flex-1 flex flex-col h-screen relative">
        <header class="h-20 bg-white dark:bg-dark-900 border-b border-slate-200 dark:border-dark-800 flex items-center justify-between px-8 z-10 transition-colors duration-300 shrink-0">
            <div>
                <h2 class="text-xl font-bold text-slate-800 dark:text-white tracking-wide">Quadro de O.S.</h2>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Gestão ágil de manutenção</p>
            </div>
            
            <div class="flex items-center gap-4">
                <button onclick="addOs()" class="bg-brand hover:bg-blue-600 text-white px-5 py-2.5 rounded-xl font-medium transition-all shadow-lg shadow-brand/30 flex items-center gap-2">
                    <i class="fas fa-plus"></i> <span class="hidden sm:inline">Nova O.S.</span>
                </button>
                
                <div class="flex items-center gap-3 pl-4 border-l border-slate-200 dark:border-dark-800">
                    <div id="user-photo" class="h-10 w-10 rounded-full bg-gradient-to-tr from-brand to-blue-400 flex items-center justify-center text-white font-bold shadow-md bg-cover bg-center"></div>
                    <div class="hidden md:block">
                        <p id="user-name" class="text-sm font-bold text-slate-800 dark:text-white">A carregar...</p>
                        <p id="user-role" class="text-xs text-slate-500 dark:text-slate-400">...</p>
                    </div>
                </div>
            </div>
        </header>

        <div class="flex-1 p-6 flex flex-col overflow-hidden">
            <div class="flex items-center gap-6 mb-4 shrink-0">
                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-slate-300 dark:bg-slate-500"></span><span class="text-xs font-semibold text-slate-500 dark:text-slate-400">Pendente (<span id="kpi-todo">0</span>)</span></div>
                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-brand"></span><span class="text-xs font-semibold text-slate-500 dark:text-slate-400">Em Execução (<span id="kpi-doing">0</span>)</span></div>
                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-green-500"></span><span class="text-xs font-semibold text-slate-500 dark:text-slate-400">Concluído (<span id="kpi-done">0</span>)</span></div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 flex-1 overflow-hidden">
                <div class="bg-slate-100 dark:bg-dark-900/50 border border-slate-200 dark:border-dark-800 rounded-2xl p-4 flex flex-col h-full">
                    <h3 class="font-bold text-slate-800 dark:text-white mb-3 flex items-center justify-between border-b border-slate-200 dark:border-dark-800 pb-2 shrink-0">
                        <span><i class="fas fa-inbox mr-2 text-slate-400"></i>Pendente</span>
                    </h3>
                    <div id="todo-list" class="space-y-3 kanban-col flex-1"></div>
                </div>

                <div class="bg-slate-100 dark:bg-dark-900/50 border border-slate-200 dark:border-dark-800 rounded-2xl p-4 flex flex-col h-full">
                    <h3 class="font-bold text-slate-800 dark:text-white mb-3 flex items-center justify-between border-b border-slate-200 dark:border-dark-800 pb-2 shrink-0">
                        <span><i class="fas fa-cogs mr-2 text-brand"></i>A Executar</span>
                    </h3>
                    <div id="doing-list" class="space-y-3 kanban-col flex-1"></div>
                </div>

                <div class="bg-slate-100 dark:bg-dark-900/50 border border-slate-200 dark:border-dark-800 rounded-2xl p-4 flex flex-col h-full">
                    <h3 class="font-bold text-slate-800 dark:text-white mb-3 flex items-center justify-between border-b border-slate-200 dark:border-dark-800 pb-2 shrink-0">
                        <span><i class="fas fa-check-circle mr-2 text-green-500"></i>Concluído</span>
                    </h3>
                    <div id="done-list" class="space-y-3 kanban-col flex-1 opacity-80"></div>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="../assets/js/os.js">
        
    </script>
</body>
</html>
