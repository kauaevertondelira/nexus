<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#204cff"><title>Página não encontrada · NEXUS Industrial</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:28px;background:#204cff;color:white;font-family:Arial,sans-serif}main{max-width:620px}strong{font-size:clamp(4rem,20vw,9rem);letter-spacing:-.08em;color:#e7f14a}h1{font-size:clamp(1.8rem,6vw,2.8rem);letter-spacing:-.04em;margin:30px 0 16px}p{line-height:1.6;color:#e1e6ff}a{display:inline-block;margin:20px 12px 0 0;border:1px solid #ffffff80;border-radius:30px;padding:15px 24px;color:white;text-decoration:none}a:focus-visible{outline:3px solid #e7f14a;outline-offset:5px}</style>
</head>
<body><main><strong>NEXUS</strong><h1>Este endereço saiu da rota.</h1><p>Abra a plataforma e escolha um módulo pelo menu. Se você acabou de publicar, confira o endereço principal em Settings → Pages no seu repositório.</p><a id="home-link" href="./index.html">Voltar à plataforma</a><noscript><p>Use o endereço principal informado pelo GitHub Pages para voltar à Nexus.</p></noscript></main>
<script>
(function(){const link=document.querySelector('#home-link'),parts=location.pathname.split('/').filter(Boolean);let base='/';const marker=location.pathname.indexOf('/public/');if(marker>=0)base=location.pathname.slice(0,marker+1);else if(location.hostname.endsWith('.github.io')&&parts.length>1)base='/'+parts[0]+'/';else if(location.hostname==='127.0.0.1'||location.hostname==='localhost')base='/'+(parts[0]||'')+'/';link.href=new URL(base+'index.html',location.origin).href;if('serviceWorker'in navigator)navigator.serviceWorker.getRegistration(location.href).then(reg=>{if(reg)link.href=new URL('index.html',reg.scope).href;}).catch(()=>{});})();
</script></body></html>
