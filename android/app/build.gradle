plugins { id 'com.android.application' }
android {
    namespace 'br.com.nexus.industrial'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.nexus.industrial'
        minSdk 26
        targetSdk 35
        versionCode 422
        versionName '4.2.2'
        resValue 'string', 'app_name', 'Nexus Industrial'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        debug {
            storeFile rootProject.file('signing/nexus-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        parallel {
            initWith debug
            applicationIdSuffix '.sensor'
            resValue 'string', 'app_name', 'Nexus Industrial 4.2.2'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
